<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N8PHSGN9"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Model definition">
      <div class="sidebar-head">
        <h2>Model</h2>
        <div class="file-actions">
          <button type="button" class="btn small ghost" id="btn-save" title="Save the model to a JSON file">Save</button>
          <button type="button" class="btn small ghost" id="btn-open" title="Open a model JSON file">Open</button>
          <button type="button" class="btn small ghost" id="btn-reset" title="Restore the default model">Reset</button>
          <input type="file" id="file-open" accept=".json,application/json" hidden>
        </div>
      </div>
      <div id="model-form"></div>
    </aside>

    <main class="main">
      <header class="main-head">
        <button type="button" class="btn small ghost menu-btn" id="btn-menu" aria-controls="sidebar">☰ Model</button>
        <div>
          <h1 id="app-title">2D Frame Analyzer</h1>
          <p class="caption">Units: kN, m, s, t. Section dimensions in mm, stresses in MPa.
            <a href="docs.html" target="_blank" rel="noopener">Documentation</a>
            <a href="../">← Ramin Sheikhi</a></p>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" role="tab" class="tab active" data-tab="model">Model</button>
        <button type="button" role="tab" class="tab" data-tab="modal">Modal</button>
        <button type="button" role="tab" class="tab" data-tab="po">Pushover</button>
        <button type="button" role="tab" class="tab" data-tab="th">Time history</button>
      </nav>

      <section class="tab-panel active" id="tab-model" role="tabpanel"></section>
      <section class="tab-panel" id="tab-modal" role="tabpanel"></section>
      <section class="tab-panel" id="tab-po" role="tabpanel"></section>
      <section class="tab-panel" id="tab-th" role="tabpanel"></section>
    </main>
  </div>

  <script src="js/linalg.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/elements.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/records.js"></script>
  <script src="js/plots.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
